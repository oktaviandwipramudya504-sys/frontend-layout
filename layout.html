<!DOCTYPE html>
<html>
<head>
  <title>Administrator - Resonance</title>
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/bootstrap.min.css')}}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    /* --- GAYA DASAR --- */
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    /* --- HERO SECTION (ALA DRIBBBLE) --- */
    .hero-section {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                url("{{ url_for('static', filename='img/Resonance.jpg') }}");
      background-size: cover;
      background-position: center;
      padding: 100px 0 60px 0;
      text-align: center;
      border-radius: 0 0 40px 40px;
    }

    /* --- NAVBAR CUSTOM --- */
    .navbar-custom {
      background-color: rgba(0,0,0,0.9) !important;
      backdrop-filter: blur(10px);
      padding: 15px 0;
      border-bottom: 1px solid rgba(218, 176, 27, 0.3);
    }

    /* Update Warna Tulisan Navbar Menjadi Kuning */
    .nav-link {
      color: #dab01b !important; /* Kuning Emas */
      margin: 0 10px;
      font-size: 14px;
      opacity: 0.9;
      transition: all 0.3s ease;
    }

    .nav-link:hover {
      color: #ffffff !important; /* Berubah putih saat di-hover agar interaktif */
      opacity: 1;
    }

    /* Warna Ikon di Navbar */
    .nav-link i {
      color: #dab01b !important;
    }

    /* Warna khusus tombol Logout tetap merah agar kontras */
    .nav-link.text-danger {
      color: #dc3545 !important;
    }

    /* --- KONTEN --- */
    .container-content {
      margin-top: -30px;
      background: #000;
      border-radius: 30px 30px 0 0;
      padding: 40px 20px;
    }

    /* --- TAMBAHAN BARU UNTUK VIDEO FULL --- */
    .container-full-video {
      max-width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 0 !important; 
    }
    
    body {
      overflow-x: hidden;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('admin_dashboard') }}">
        <img src="{{ url_for('static', filename='img/Resonance.jpg') }}" alt="Logo" style="height: 40px;">
      </a>
      <div class="collapse navbar-collapse" id="navRes">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_dashboard') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_kategori') }}">Kategori</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_paket') }}">Paket</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_laporan') }}">Laporan</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('admin_barang')}}">Barang</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('admin_client')}}">Client</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('admin_pemasukan')}}">Pemasukan</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('admin_pengeluaran')}}">Pengeluaran</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('admin_akun')}}"><i class="fa fa-user-circle"></i> Akun</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="{{url_for('admin_logout')}}">Log out</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container container-content {% if request.endpoint == 'admin_dashboard' %}container-full-video{% endif %}">
    {% block konten %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
